name: Switch build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      crash_offsets:
        description: "Offsets from an Atmosphère crash report (the 0x... in 'Mindustry + 0x...'), space separated, to symbolize"
        required: false
        default: ""

permissions:
  contents: write

# A newer push makes an older build pointless (tags and master keep every run)
concurrency:
  group: switch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nro:
    name: Nintendo Switch NRO
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: Mindustry

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip rsync cmake ninja-build make curl git python3 ca-certificates
          # The devkita64 image already ships most portlibs. Only talk to
          # pkg.devkitpro.org (which often answers 403 to CI) if something is missing.
          PL=$DEVKITPRO/portlibs/switch/lib
          missing=0
          for lib in libSDL2.a libSDL2_mixer.a libfreetype.a libglad.a libcurl.a libzzip.a \
                     libvorbisidec.a libEGL.a libglapi.a libdrm_nouveau.a libz.a; do
            [ -f "$PL/$lib" ] || { echo "missing $lib"; missing=1; }
          done
          [ $missing = 0 ] && exit 0
          for delay in 0 15 30 60 120; do
            sleep $delay
            dkp-pacman -Sy --noconfirm --needed switch-dev switch-cmake switch-pkg-config \
              switch-zlib switch-libvorbis switch-zziplib switch-sdl2 switch-sdl2_mixer \
              switch-freetype switch-glad switch-curl switch-mesa switch-libdrm_nouveau && exit 0
          done
          exit 1

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            Mindustry/build/clearwing-*
          key: gradle-${{ hashFiles('Mindustry/**/*.gradle', 'Mindustry/gradle.properties', 'Mindustry/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Restore/save separately so objects are kept even when the link fails
      - name: Restore C++ objects
        uses: actions/cache/restore@v6
        with:
          path: Mindustry/build/Mindustry
          key: switch-objs-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: switch-objs-

      - name: Build libffi for Switch
        run: bash Mindustry/scripts/build-libffi.sh

      - name: Fetch Arc and rhino
        run: bash Mindustry/scripts/setup-switch-deps.sh

      - name: Build
        env:
          JOBS: "4"
        run: bash Mindustry/scripts/build-switch.sh

      - name: Save C++ objects
        if: always()
        uses: actions/cache/save@v6
        with:
          path: Mindustry/build/Mindustry
          key: switch-objs-${{ github.sha }}-${{ github.run_attempt }}

      - name: Symbolize crash offsets
        if: ${{ inputs.crash_offsets != '' }}
        env:
          OFFSETS: ${{ inputs.crash_offsets }}
        run: |
          ELF=Mindustry/build/Mindustry/build-switch/Mindustry.elf
          [ -f "$ELF" ] || ELF=Mindustry/build/Mindustry/build-switch/Mindustry
          for off in $OFFSETS; do
            echo "== $off"
            "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-addr2line" -f -C -i -e "$ELF" "$off"
          done

      - name: Copy NRO
        run: cp Mindustry/build/Mindustry/build-switch/Mindustry.nro Mindustry.nro

      - uses: actions/upload-artifact@v7
        with:
          name: Mindustry-nro
          path: Mindustry.nro

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: Mindustry.nro
          generate_release_notes: true
