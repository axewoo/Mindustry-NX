// The transpile and NRO steps live in scripts/build-switch.sh. This module only
// compiles the launcher, the controller support and the Switch replacements for a few
// core and Arc classes (scripts/build-switch.sh drops the originals), and gathers the
// runtime jars the Clearwing transpiler needs into build/switch-deps.

tasks.register('switchDeps', Sync){
    group = 'SwitchGDX'
    description = 'Collect the classes and runtime jars for the Clearwing transpiler into build/switch-deps'
    dependsOn 'classes'
    into layout.buildDirectory.dir('switch-deps')
    from(layout.buildDirectory.dir('classes/java/main')){ into 'classes' }
    from(configurations.runtimeClasspath.filter{ it.isFile() }){ into 'libs' }
}
